  - name: settings
    label: Site settings
    type: file
    path: src/data/site.yaml
    format: yaml
    fields:
      - name: site
        label: Settings
        type: object
        fields:
          - name: diaryDates
            label: Dates for your diary
            description: Upcoming public dates. Past ones disappear by themselves.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.text}"
            fields:
              - name: date
                label: Date
                type: date
                required: true
                options:
                  format: yyyy-MM-dd
              - name: text
                label: What's happening
                type: string
                required: true
              - name: label
                label: Date wording (optional)
                description: e.g. "Every Saturday in December".
                type: string
              - name: url
                label: Link (optional)
                type: string
          - name: totalRaised
            label: Total raised since 1999
            description: Number only, e.g. "250,000". Leave as [TOTAL] to hide it.
            type: string
            required: true
          - name: groupsHelped
            label: Number of groups and projects helped
            type: string
            required: true
          - name: contactEmail
            label: Contact email
            type: string
            required: true
          - name: meetingInfo
            label: When we meet
            description: Completes the sentence "We meet …".
            type: string
            required: true
          - name: meetingPubs
            label: Meeting pubs
            description: The meeting is always in one of these. Shown with a map link on Get involved, Contact and Meet the dads.
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.name}"
            fields:
              - name: name
                label: Pub name
                type: string
                required: true
              - name: mapUrl
                label: Map link (Google Maps)
                type: string
          - name: joinHeadline
            label: Join us headline
            type: string
            required: true
          - name: joinText
            label: Join us text
            type: text
            required: true
          - name: whoWeAre
            label: Who we are
            type: text
            required: true
          - name: storyIntro
            label: Our story introduction
            type: text
            required: true
          - name: storyImage
            label: Our story photo
            type: image
            options:
              media: uploads
              path: public/uploads/images
          - name: storyImageAlt
            label: Our story photo description
            type: string
          - name: storyImageCaption
            label: Our story photo caption (with when it was taken)
            type: string
          - name: wolfspitIntro
            label: Wolf's Pit introduction
            type: text
            required: true
          - name: wolfspitEntryUrl
            label: Wolf's Pit entry link
            type: string
            required: true
          - name: sumupStoreUrl
            label: SumUp store link
            type: string
            required: true
          - name: christmasCardPaymentUrl
            label: Christmas card payment link
            type: string
            required: true
          - name: donationLinks
            label: Donation buttons (exactly three)
            type: object
            list:
              min: 3
              max: 3
            fields:
              - name: amount
                label: Amount (£)
                type: number
                required: true
              - name: url
                label: Link
                type: string
                required: true
              - name: label
                label: What it pays for
                type: string
                required: true
          - name: donationQr
            label: Donation QR code image
            type: image
            options:
              media: uploads
              path: public/uploads/images
          - name: facebookPosts
            label: Facebook posts on the homepage (up to three)
            type: object
            list:
              max: 3
            fields:
              - name: date
                label: Date
                type: string
                required: true
              - name: text
                label: Text
                type: text
                required: true
              - name: url
                label: Link to the post
                type: string
                required: true
              - name: image
                label: Image (optional)
                type: image
                options:
                  media: uploads
                  path: public/uploads/images
              - name: imageAlt
                label: Image description
                type: string
          - name: sharePhotosUrl
            label: '"Share your photos" link'
            type: string
            required: true
          - name: contactFormUrl
            label: Contact form address (Formspree)
            description: The form's address from formspree.io, e.g. https://formspree.io/f/abcd1234. Leave as "#" to hide the form.
            type: string
            required: true
          - name: accountsUrl
            label: Annual accounts link
            description: Leave as "#" until there's a real link.
            type: string
            required: true
          - name: name
            label: Site name
            type: string
            required: true
          - name: tagline
            label: Tagline
            type: string
            required: true
          - name: description
            label: Description for search engines
            type: text
            required: true
          - name: facebookUrl
            label: Facebook page link
            type: string
            required: true
          - name: cicName
            label: CIC name
            type: string
            required: true
          - name: cicNumber
            label: Company number
            type: string
            required: true
          - name: registeredOffice
            label: Registered office address
            description: As shown on Companies House. Company websites must show it (it appears in the footer).
            type: string
