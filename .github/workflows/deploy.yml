# Builds the site and publishes it to GitHub Pages on every push to main.
# One-off setup on GitHub: Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so "Next up" on the homepage moves on after each event
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write # lets the build commit resized photos back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # Astro 7 needs Node 22.23+
          cache: npm
      - run: npm ci
      # Photos uploaded through the editor (Pages CMS) arrive full size: shrink them to web size,
      # strip hidden location data, and commit the smaller versions so the repo stays small.
      - name: Resize new photos
        run: |
          node scripts/resize-uploads.mjs
          if [ -n "$(git status --porcelain public/uploads)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/uploads
            git commit -m "Resize uploaded photos to web size"
            git push || echo "Couldn't push resized photos (a newer change arrived); the next build will retry."
          fi
      # Keep the generated 480px/960px photo copies between builds (make-thumbs.mjs only makes missing ones)
      - uses: actions/cache@v6
        with:
          path: public/uploads/thumbs
          key: thumbs-${{ github.run_id }}
          restore-keys: thumbs-
      - run: npm run build
        env:
          # Latest Facebook posts (scripts/fetch-facebook.mjs); without these the site just skips them
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      # New Facebook posts arrive as DRAFT news stories (scripts/fetch-facebook.mjs). Save them to the
      # repository so editors can check and publish them in Pages CMS. (Pushes made here don't start
      # another deploy.) If the push fails, nothing is lost: the next build imports them again.
      - name: Save Facebook drafts
        run: |
          git add -A src/content/news src/content/albums
          if [ -f src/data/facebook-seen.json ]; then git add src/data/facebook-seen.json; fi
          if [ -d public/uploads/news/facebook ]; then git add -A public/uploads/news/facebook; fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Facebook posts: new drafts, photos and albums"
            git push || echo "Couldn't save the Facebook drafts (a newer change arrived); the next build will retry."
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
